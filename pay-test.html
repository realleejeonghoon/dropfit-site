<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dropfit 결제 시험 (시험 계정)</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; background: #fff; color: #1d1d1f; }
  main { max-width: 480px; margin: 64px auto; padding: 0 16px; }
  .note { color: #6e6e73; font-size: 14px; }
  .price { font-size: 28px; font-weight: 600; margin: 24px 0 4px; }
  .price s { font-size: 16px; color: #6e6e73; font-weight: 400; margin-left: 8px; }
  button { font: inherit; font-size: 16px; padding: 12px 22px; border: 0; border-radius: 980px; background: linear-gradient(180deg, #cce1f5, #a3c4e6); color: #3c608a; cursor: pointer; }
  pre { background: #f5f5f7; padding: 12px; border-radius: 10px; font-size: 13px; white-space: pre-wrap; }
</style>
<!-- 시험 계정 전용. 실제 판매 설정(paddle-config.js)은 쓰지 않습니다. -->
<script>
window.DROPFIT_PADDLE = {
  stage: 'open',
  environment: 'sandbox',
  token: 'test_4a858d17af1b4d6af9cc999032e',   // 시험용 client-side token(test_…)
  priceId: 'pri_01m77yz1522ayh3ajarm9jnvz3',
  discountId: 'dsc_01m7hx8hh6x8eychsv6hzz54t3',
  discountEnds: '2026-11-30T14:59:00Z',
  plans: {}
};
</script>
</head>
<body>
<main>
  <h1>Dropfit 결제 시험</h1>
  <p class="note">Paddle 시험 계정입니다. 실제 돈이 나가지 않습니다. 시험 카드 4242 4242 4242 4242, 만료일은 미래 아무 날짜, CVC 아무 숫자.</p>
  <p class="price"><span data-price="pro">가격 불러오는 중…</span><s data-price="pro-regular"></s></p>
  <button type="button" data-buy id="buy">시험 결제 열기</button>
  <pre id="log">결과가 여기에 나옵니다.</pre>
</main>
<script>
  var log = document.getElementById('log');
  document.getElementById('buy').addEventListener('click', function () {
    if (!window.DropfitCheckout) { log.textContent = '결제 설정이 비어 있습니다(token).'; return; }
    DropfitCheckout.open({ locale: 'ko', from: 'pay-test' }).catch(function (e) { log.textContent = String(e); });
  });
  document.addEventListener('dropfit:paid', function (e) {
    e.preventDefault();
    log.textContent = '결제 완료\ntransactionId: ' + e.detail.transactionId + '\nemail: ' + e.detail.email;
  });
</script>
<script src="checkout.js" defer></script>
</body>
</html>
