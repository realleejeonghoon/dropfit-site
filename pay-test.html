<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dropfit 결제 시험 (시험 계정)</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; background: #fff; color: #1d1d1f; }
  main { max-width: 480px; margin: 64px auto; padding: 0 16px; }
  .note { color: #6e6e73; font-size: 14px; }
  .price { font-size: 28px; font-weight: 600; margin: 24px 0 4px; }
  .price s { font-size: 16px; color: #6e6e73; font-weight: 400; margin-left: 8px; }
  button { font: inherit; font-size: 16px; padding: 12px 22px; border: 0; border-radius: 980px; background: linear-gradient(180deg, #cce1f5, #a3c4e6); color: #3c608a; cursor: pointer; }
  pre { background: #f5f5f7; padding: 12px; border-radius: 10px; font-size: 13px; white-space: pre-wrap; }
</style>
<!-- 결제 점검용(공개 안 함). 기본은 시험 계정. 주소 끝에 #live_… (실계정 client-side token)을 붙이면 실계정으로 결제합니다. 실제 판매 설정(paddle-config.js)은 쓰지 않습니다. -->
<script>
(function () {
  var h = location.hash.slice(1), live = /^live_[a-z0-9]{20,40}$/.test(h);
  window.__payLive = live;
  window.DROPFIT_PADDLE = live ? {
    stage: 'open',
    environment: 'production',
    token: h,                                      // 실계정 client-side token(주소 #뒤, 파일에 넣지 않음)
    priceId: 'pri_01m7meqdc6y15147vppscdsdfg',      // 실계정 Dropfit Pro ₩14,900
    discountId: 'dsc_01m7metejtxcjfte4pvm96h146',   // 실계정 출시 기념가
    discountEnds: '2026-11-30T14:59:00Z',
    plans: {}
  } : {
    stage: 'open',
    environment: 'sandbox',
    token: 'test_4a858d17af1b4d6af9cc999032e',     // 시험용 client-side token(test_…)
    priceId: 'pri_01m77yz1522ayh3ajarm9jnvz3',
    discountId: 'dsc_01m7hx8hh6x8eychsv6hzz54t3',
    discountEnds: '2026-11-30T14:59:00Z',
    plans: {}
  };
})();
</script>
</head>
<body>
<main>
  <h1>Dropfit 결제 시험</h1>
  <p class="note" id="mode">Paddle 시험 계정입니다. 실제 돈이 나가지 않습니다. 시험 카드 4242 4242 4242 4242, 만료일은 미래 아무 날짜, CVC 아무 숫자.</p>
  <p class="price"><span data-price="pro">가격 불러오는 중…</span><s data-price="pro-regular"></s></p>
  <button type="button" data-buy id="buy">시험 결제 열기</button>
  <pre id="log">결과가 여기에 나옵니다.</pre>
</main>
<script>
  var log = document.getElementById('log');
  var COUNT_URL = 'https://script.google.com/macros/s/AKfycbyh4PCaMhGnR2MqHC5dj_C-kFilK0iX2a5KKrZfWOj4YpLEo8kA7RvDTG0PzrZMUg72tQ/exec';
  if (window.__payLive) {
    document.getElementById('mode').textContent = '실계정입니다. 실제로 결제됩니다(점검 뒤 Paddle에서 환불).';
    document.getElementById('buy').textContent = '실결제 열기';
    document.title = 'Dropfit 결제 점검 (실계정)';
  }
  document.getElementById('buy').addEventListener('click', function () {
    if (!window.DropfitCheckout) { log.textContent = '결제 설정이 비어 있습니다(token).'; return; }
    DropfitCheckout.open({ locale: 'ko', from: window.__payLive ? 'pay-live' : 'pay-test' }).catch(function (e) { log.textContent = String(e); });
  });
  // 결제 완료 뒤 판매 페이지와 같은 방법(?license=거래 번호)으로 키를 받아 활성화 링크를 보여 줍니다
  function lookup(txn, tries, base) {
    fetch(COUNT_URL + '?license=' + encodeURIComponent(txn), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.activate && /^dropfit:\/\/activate\?key=/.test(d.activate)) {
          log.textContent = base + '\n키 준비됨: 아래 링크를 누르면 Dropfit이 열리며 Pro가 활성화됩니다.';
          var a = document.createElement('a'); a.href = d.activate; a.textContent = 'Dropfit 열기'; log.appendChild(document.createElement('br')); log.appendChild(a); return;
        }
        if (d && d.pending && tries > 1) { log.textContent = base + '\n키 준비 중… (' + tries + ')'; setTimeout(function () { lookup(txn, tries - 1, base); }, 3000); return; }
        log.textContent = base + '\n키 응답: ' + JSON.stringify(d).slice(0, 200);
      })
      .catch(function (x) { if (tries > 1) setTimeout(function () { lookup(txn, tries - 1, base); }, 3000); else log.textContent = base + '\n키 조회 실패: ' + x; });
  }
  document.addEventListener('dropfit:paid', function (e) {
    e.preventDefault();
    var base = '결제 완료\ntransactionId: ' + e.detail.transactionId + '\nemail: ' + e.detail.email;
    log.textContent = base + '\n키 확인 중…';
    lookup(e.detail.transactionId, 20, base);
  });
</script>
<script src="checkout.js" defer></script>
</body>
</html>
